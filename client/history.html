<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History — Primal-Fit</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .hist-list { max-width: 560px; margin: 0 auto; }
        .hist-item { background: var(--surface); border-radius: 12px; padding: 1rem; margin-bottom: 0.75rem; border: 1px solid rgba(255,255,255,0.1); }
        .hist-item a { color: var(--accent-color); text-decoration: none; }
        .hist-item .date { color: var(--muted-text); font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="main.html" style="color:inherit;text-decoration:none">Primal-Fit</a></div>
        <button class="nav-burger" id="nav-burger" aria-label="Menu"><span></span><span></span><span></span></button>
        <ul class="nav-links" id="nav-links">
            <li><a href="main.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="workout-plans.html">Workout Plans</a></li>
            <li><a href="exercises.html">Exercises</a></li>
            <li><a href="calendar.html">Calendar</a></li>
            <li><a href="history.html">History</a></li>
            <li><a href="rate-us.html">Rate Us</a></li>
            <li><a href="about.html">About Us</a></li>
            <li class="nav-guest"><a href="index.html">Login</a></li>
            <li class="nav-guest"><a href="index.html">Register</a></li>
            <li id="nav-profile-wrap" class="hidden">
                <div class="profile-dropdown" id="profile-dropdown">
                    <button class="dropdown-toggle" id="profile-dropdown-toggle" type="button">My Profile ▾</button>
                    <ul class="dropdown-menu">
                        <li><a href="profile.html">My Profile</a></li>
                        <li><a href="admin.html" id="nav-manage-users" style="display:none">Manage Users</a></li>
                        <li><button type="button" id="nav-logout">Log out</button></li>
                    </ul>
                </div>
            </li>
            <li><button id="theme-toggle" class="theme-toggle-btn" type="button">Switch Theme</button></li>
        </ul>
    </nav>
    <main class="container">
        <h2 style="color: var(--text-color); margin-bottom: 1rem;">Workout history</h2>
        <p id="hist-loading" class="muted-text">Loading…</p>
        <div id="hist-list" class="hist-list"></div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script>
        if (!window.requireAuth()) {}
        var token = window.getToken();
        fetch(window.API_URL + '/workoutlogs?limit=50', { headers: { 'Authorization': 'Bearer ' + token } })
            .then(function (r) { return r.json(); })
            .then(function (logs) {
                document.getElementById('hist-loading').classList.add('hidden');
                var list = document.getElementById('hist-list');
                (logs || []).forEach(function (log) {
                    var d = new Date(log.createdAt);
                    var item = document.createElement('div');
                    item.className = 'hist-item';
                    item.innerHTML = '<a href="log-detail.html?id=' + log._id + '">' + (log.exerciseLogs && log.exerciseLogs.length ? log.exerciseLogs.length + ' exercises' : 'Workout') + '</a><br><span class="date">' + d.toLocaleDateString() + ' · ' + (log.durationMinutes || '') + ' min</span>';
                    list.appendChild(item);
                });
                if (!logs || logs.length === 0) list.innerHTML = '<p class="muted-text">No workouts logged yet.</p>';
            })
            .catch(function () { document.getElementById('hist-loading').textContent = 'Error loading history.'; });
    </script>
</body>
</html>
