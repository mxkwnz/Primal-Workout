<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — Primal-Fit</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .reset-wrap { max-width: 400px; margin: 2rem auto; padding: 1rem; }
        .reset-wrap h2 { color: var(--text-color); margin-bottom: 1rem; }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="main.html" style="color:inherit;text-decoration:none">Primal-Fit</a></div>
        <ul class="nav-links"><li><a href="index.html">Login</a></li></ul>
    </nav>
    <main class="container reset-wrap">
        <h2>Set new password</h2>
        <p id="reset-msg" class="muted-text"></p>
        <form id="reset-form">
            <input type="hidden" id="reset-token" value="">
            <input type="password" id="reset-password" placeholder="New password (min 6 characters)" required minlength="6">
            <button type="submit">Save password</button>
        </form>
    </main>
    <script src="js/api.js"></script>
    <script>
        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');
        if (token) document.getElementById('reset-token').value = token;
        else document.getElementById('reset-msg').textContent = 'Invalid link. Use the link from your email.';
        document.getElementById('reset-form').addEventListener('submit', function (e) {
            e.preventDefault();
            var t = document.getElementById('reset-token').value;
            var p = document.getElementById('reset-password').value;
            if (!t) { document.getElementById('reset-msg').textContent = 'Missing token.'; return; }
            fetch(window.API_URL + '/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: t, password: p })
            }).then(function (r) { return r.json(); }).then(function (d) {
                if (d.token) {
                    localStorage.setItem('token', d.token);
                    document.getElementById('reset-msg').textContent = 'Password updated. Redirecting…';
                    setTimeout(function () { window.location.href = 'dashboard.html'; }, 1500);
                } else {
                    document.getElementById('reset-msg').textContent = d.message || 'Failed.';
                }
            });
        });
    </script>
</body>
</html>
