<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercises — Primal-Fit</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .ex-hero { margin-bottom: 1.5rem; }
        .ex-filters { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
        .ex-filters input, .ex-filters select { width: auto; min-width: 140px; margin: 0; display: inline-block; }
        .ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
        .ex-card { background: var(--surface); border: 1px solid rgba(255,255,255,0.14); border-radius: 16px; padding: 1rem; transition: transform 0.2s; }
        .ex-card:hover { transform: translateY(-2px); }
        .ex-card h4 { margin: 0 0 0.5rem; color: var(--text-color); font-size: 1rem; }
        .ex-card .meta { font-size: 0.8rem; color: var(--muted-text); }
        .ex-card a { color: var(--accent-color); font-size: 0.9rem; margin-top: 0.5rem; display: inline-block; }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="main.html" style="color:inherit;text-decoration:none">Primal-Fit</a></div>
        <button class="nav-burger" id="nav-burger" aria-label="Menu"><span></span><span></span><span></span></button>
        <ul class="nav-links" id="nav-links">
            <li><a href="main.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="workout-plans.html">Workout Plans</a></li>
            <li><a href="exercises.html">Exercises</a></li>
            <li><a href="calendar.html">Calendar</a></li>
            <li><a href="history.html">History</a></li>
            <li><a href="rate-us.html">Rate Us</a></li>
            <li><a href="about.html">About Us</a></li>
            <li class="nav-guest"><a href="index.html">Login</a></li>
            <li class="nav-guest"><a href="index.html">Register</a></li>
            <li id="nav-profile-wrap" class="hidden">
                <div class="profile-dropdown" id="profile-dropdown">
                    <button class="dropdown-toggle" id="profile-dropdown-toggle" type="button">My Profile ▾</button>
                    <ul class="dropdown-menu">
                        <li><a href="profile.html">My Profile</a></li>
                        <li><a href="admin.html" id="nav-manage-users" style="display:none">Manage Users</a></li>
                        <li><button type="button" id="nav-logout">Log out</button></li>
                    </ul>
                </div>
            </li>
            <li><button id="theme-toggle" class="theme-toggle-btn" type="button">Switch Theme</button></li>
        </ul>
    </nav>
    <main class="container">
        <div class="ex-hero">
            <h2 style="color: var(--text-color); margin-bottom: 0.5rem;">Exercise catalog</h2>
            <p class="muted-text">Browse and filter exercises.</p>
        </div>
        <div class="ex-filters">
            <input type="text" id="filter-q" placeholder="Search name">
            <select id="filter-difficulty"><option value="">All difficulty</option><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="hard">Hard</option></select>
            <select id="filter-type"><option value="">All type</option><option value="strength">Strength</option><option value="cardio">Cardio</option><option value="mobility">Mobility</option><option value="stretch">Stretch</option></select>
            <button type="button" id="filter-btn" class="btn" style="width:auto">Apply</button>
        </div>
        <p id="ex-loading" class="muted-text">Loading…</p>
        <div id="ex-list" class="ex-grid"></div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script>
        var headers = window.getToken() ? window.getAuthHeaders() : { 'Content-Type': 'application/json' };
        function load() {
            var q = document.getElementById('filter-q').value.trim();
            var difficulty = document.getElementById('filter-difficulty').value;
            var type = document.getElementById('filter-type').value;
            var url = window.API_URL + '/exercises?';
            if (q) url += 'q=' + encodeURIComponent(q) + '&';
            if (difficulty) url += 'difficulty=' + encodeURIComponent(difficulty) + '&';
            if (type) url += 'type=' + encodeURIComponent(type) + '&';
            document.getElementById('ex-loading').classList.remove('hidden');
            fetch(url, { headers: headers })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    document.getElementById('ex-loading').classList.add('hidden');
                    var list = document.getElementById('ex-list');
                    list.innerHTML = '';
                    (data || []).forEach(function (ex) {
                        var card = document.createElement('div');
                        card.className = 'ex-card';
                        card.innerHTML = '<h4>' + (ex.name || '') + '</h4><p class="meta">' + (ex.difficulty || '') + ' · ' + (ex.type || '') + '</p><a href="exercise-detail.html?id=' + ex._id + '">View</a>';
                        list.appendChild(card);
                    });
                })
                .catch(function () { document.getElementById('ex-loading').textContent = 'Error loading exercises.'; });
        }
        document.getElementById('filter-btn').addEventListener('click', load);
        load();
    </script>
</body>
</html>
