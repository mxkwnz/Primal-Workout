<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar — Primal-Fit</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
        .cal-header h2 { margin: 0; color: var(--text-color); }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; max-width: 720px; }
        .cal-cell { min-height: 64px; padding: 6px; border-radius: 8px; background: var(--surface); border: 1px solid rgba(255,255,255,0.08); font-size: 0.85rem; }
        .cal-cell.head { font-weight: 600; color: var(--muted-text); background: transparent; border: none; }
        .cal-cell .day-num { color: var(--text-color); }
        .cal-cell.planned { border-left: 3px solid var(--accent-color); }
        .cal-cell.completed { background: rgba(34, 197, 94, 0.2); border-left: 3px solid var(--success-color); }
        .cal-cell.skipped { opacity: 0.7; }
        .cal-cell .evt { font-size: 0.75rem; color: var(--accent-color); margin-top: 4px; }
        .add-wrap { margin-top: 1rem; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
        .modal.open { display: flex; }
        .modal-inner { background: var(--secondary-color); border-radius: 16px; padding: 1.5rem; max-width: 400px; width: 100%; }
        .modal-inner h3 { margin: 0 0 1rem; color: var(--text-color); }
        .modal-inner label { display: block; margin-bottom: 0.25rem; color: var(--muted-text); }
        .modal-inner input, .modal-inner select { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="main.html" style="color:inherit;text-decoration:none">Primal-Fit</a></div>
        <button class="nav-burger" id="nav-burger" aria-label="Menu"><span></span><span></span><span></span></button>
        <ul class="nav-links" id="nav-links">
            <li><a href="main.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="workout-plans.html">Workout Plans</a></li>
            <li><a href="exercises.html">Exercises</a></li>
            <li><a href="calendar.html">Calendar</a></li>
            <li><a href="history.html">History</a></li>
            <li><a href="rate-us.html">Rate Us</a></li>
            <li><a href="about.html">About Us</a></li>
            <li class="nav-guest"><a href="index.html">Login</a></li>
            <li class="nav-guest"><a href="index.html">Register</a></li>
            <li id="nav-profile-wrap" class="hidden">
                <div class="profile-dropdown" id="profile-dropdown">
                    <button class="dropdown-toggle" id="profile-dropdown-toggle" type="button">My Profile ▾</button>
                    <ul class="dropdown-menu">
                        <li><a href="profile.html">My Profile</a></li>
                        <li><a href="admin.html" id="nav-manage-users" style="display:none">Manage Users</a></li>
                        <li><button type="button" id="nav-logout">Log out</button></li>
                    </ul>
                </div>
            </li>
            <li><button id="theme-toggle" class="theme-toggle-btn" type="button">Switch Theme</button></li>
        </ul>
    </nav>
    <main class="container">
        <div class="cal-header">
            <h2 id="cal-title">Calendar</h2>
            <div>
                <button type="button" id="cal-prev" class="btn" style="width:auto;margin-right:0.5rem">←</button>
                <button type="button" id="cal-next" class="btn" style="width:auto;margin-right:0.5rem">→</button>
                <button type="button" id="cal-add" class="btn" style="width:auto">Add workout</button>
            </div>
        </div>
        <p id="cal-loading" class="muted-text">Loading…</p>
        <div id="cal-grid" class="cal-grid"></div>
        <div id="cal-legend" style="margin-top:1rem;font-size:0.85rem;color:var(--muted-text)">
            <span style="margin-right:1rem">■ Planned</span>
            <span style="margin-right:1rem">■ Completed</span>
        </div>
    </main>
    <div id="modal" class="modal">
        <div class="modal-inner">
            <h3>Schedule workout</h3>
            <label>Date</label>
            <input type="date" id="modal-date">
            <label>Plan</label>
            <select id="modal-plan"></select>
            <div style="display:flex;gap:0.5rem;margin-top:1rem">
                <button type="button" id="modal-cancel" class="btn" style="width:auto">Cancel</button>
                <button type="button" id="modal-save" class="btn" style="width:auto">Save</button>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script>
        if (!window.requireAuth()) {}
        var token = window.getToken();
        var currentMonth = new Date().getMonth();
        var currentYear = new Date().getFullYear();
        var scheduled = [];
        var plans = [];

        function toDateStr(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function monthStart(y, m) { return new Date(y, m, 1); }
        function monthEnd(y, m) { return new Date(y, m + 1, 0); }

        function renderCal() {
            document.getElementById('cal-title').textContent = monthStart(currentYear, currentMonth).toLocaleString('default', { month: 'long', year: 'numeric' });
            var start = monthStart(currentYear, currentMonth);
            var end = monthEnd(currentYear, currentMonth);
            var from = new Date(start); from.setDate(from.getDate() - 7);
            var to = new Date(end); to.setDate(to.getDate() + 7);
            fetch(window.API_URL + '/scheduled?from=' + toDateStr(from) + '&to=' + toDateStr(to), { headers: { 'Authorization': 'Bearer ' + token } })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    scheduled = data || [];
                    var grid = document.getElementById('cal-grid');
                    grid.innerHTML = '';
                    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                    days.forEach(function (d) { grid.appendChild(createCell(d, true)); });
                    var firstDay = start.getDay();
                    var empty = firstDay;
                    for (var i = 0; i < empty; i++) grid.appendChild(createCell('', false, null));
                    for (var d = 1; d <= end.getDate(); d++) {
                        var date = new Date(currentYear, currentMonth, d);
                        var dateStr = toDateStr(date);
                        var ev = scheduled.find(function (s) { return toDateStr(new Date(s.date)) === dateStr; });
                        grid.appendChild(createCell(d, false, dateStr, ev));
                    }
                    document.getElementById('cal-loading').classList.add('hidden');
                });
        }
        function createCell(content, isHead, dateStr, ev) {
            var cell = document.createElement('div');
            cell.className = 'cal-cell' + (isHead ? ' head' : '');
            if (ev) {
                cell.classList.add(ev.status === 'completed' ? 'completed' : 'planned');
                cell.innerHTML = '<span class="day-num">' + content + '</span><div class="evt">' + (ev.workoutTemplateId && ev.workoutTemplateId.name ? ev.workoutTemplateId.name : 'Workout') + '</div>';
            } else {
                cell.innerHTML = isHead ? content : '<span class="day-num">' + content + '</span>';
            }
            if (!isHead && dateStr) {
                cell.style.cursor = 'pointer';
                if (ev && ev.status === 'planned') {
                    cell.addEventListener('click', function () { window.location.href = 'workout.html?id=' + ev._id; });
                } else if (ev && ev.status === 'completed') {
                    cell.addEventListener('click', function () { window.location.href = 'history.html'; });
                } else {
                    cell.addEventListener('click', function () { openModal(dateStr); });
                }
            }
            return cell;
        }
        function openModal(presetDate) {
            document.getElementById('modal-date').value = presetDate || toDateStr(new Date());
            fetch(window.API_URL + '/workouts', { headers: { 'Authorization': 'Bearer ' + token } })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    plans = data || [];
                    var sel = document.getElementById('modal-plan');
                    sel.innerHTML = '<option value="">Select plan</option>';
                    plans.forEach(function (p) {
                        var opt = document.createElement('option');
                        opt.value = p._id;
                        opt.textContent = p.name;
                        sel.appendChild(opt);
                    });
                });
            document.getElementById('modal').classList.add('open');
        }
        function closeModal() { document.getElementById('modal').classList.remove('open'); }
        document.getElementById('cal-prev').addEventListener('click', function () {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCal();
        });
        document.getElementById('cal-next').addEventListener('click', function () {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCal();
        });
        document.getElementById('cal-add').addEventListener('click', function () { openModal(); });
        document.getElementById('modal-cancel').addEventListener('click', closeModal);
        document.getElementById('modal-save').addEventListener('click', function () {
            var date = document.getElementById('modal-date').value;
            var planId = document.getElementById('modal-plan').value;
            if (!date || !planId) return;
            fetch(window.API_URL + '/scheduled', {
                method: 'POST',
                headers: window.getAuthHeaders(),
                body: JSON.stringify({ date: date, workoutTemplateId: planId })
            }).then(function (r) { return r.json(); }).then(function (d) {
                if (d._id) { closeModal(); renderCal(); } else alert(d.message || 'Failed');
            });
        });
        renderCal();
    </script>
</body>
</html>
