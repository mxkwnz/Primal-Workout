<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise — Primal-Fit</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .ex-detail { max-width: 560px; margin: 0 auto; }
        .ex-detail h2 { color: var(--text-color); margin-bottom: 0.5rem; }
        .ex-detail .meta { color: var(--muted-text); margin-bottom: 1rem; }
        .ex-detail .block { margin-bottom: 1.5rem; }
        .ex-detail .block h3 { font-size: 1rem; color: var(--text-color); margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="main.html" style="color:inherit;text-decoration:none">Primal-Fit</a></div>
        <button class="nav-burger" id="nav-burger" aria-label="Menu"><span></span><span></span><span></span></button>
        <ul class="nav-links" id="nav-links">
            <li><a href="exercises.html">← Exercises</a></li>
            <li><button id="theme-toggle" class="theme-toggle-btn" type="button">Switch Theme</button></li>
        </ul>
    </nav>
    <main class="container ex-detail">
        <p id="ex-loading" class="muted-text">Loading…</p>
        <div id="ex-content" class="hidden">
            <h2 id="ex-name"></h2>
            <p class="meta" id="ex-meta"></p>
            <div class="block" id="ex-instructions"></div>
            <div class="block" id="ex-tips"></div>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script>
        var id = new URLSearchParams(window.location.search).get('id');
        if (!id) { document.getElementById('ex-loading').textContent = 'No exercise selected.'; }
        else {
            var headers = window.getToken() ? window.getAuthHeaders() : {};
            fetch(window.API_URL + '/exercises/' + id, { headers: headers })
                .then(function (r) { return r.json(); })
                .then(function (ex) {
                    document.getElementById('ex-loading').classList.add('hidden');
                    document.getElementById('ex-content').classList.remove('hidden');
                    document.getElementById('ex-name').textContent = ex.name || '';
                    document.getElementById('ex-meta').textContent = [ex.difficulty, ex.type, (ex.muscleGroups || []).join(', ')].filter(Boolean).join(' · ');
                    document.getElementById('ex-instructions').innerHTML = ex.instructions ? '<h3>Instructions</h3><p>' + ex.instructions + '</p>' : '';
                    document.getElementById('ex-tips').innerHTML = ex.tips ? '<h3>Tips</h3><p>' + ex.tips + '</p>' : '';
                })
                .catch(function () { document.getElementById('ex-loading').textContent = 'Error loading exercise.'; });
        }
    </script>
</body>
</html>
