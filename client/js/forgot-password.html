<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password — Primal-Fit</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .forgot-wrap { max-width: 400px; margin: 2rem auto; padding: 1rem; }
        .forgot-wrap h2 { color: var(--text-color); margin-bottom: 1rem; }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="main.html" style="color:inherit;text-decoration:none">Primal-Fit</a></div>
        <ul class="nav-links"><li><a href="index.html">Login</a></li></ul>
    </nav>
    <main class="container forgot-wrap">
        <h2>Forgot password</h2>
        <p id="forgot-msg" class="muted-text">Enter your email and we'll send a reset link (if SMTP is configured).</p>
        <form id="forgot-form">
            <input type="email" id="forgot-email" placeholder="Email" required>
            <button type="submit">Send reset link</button>
        </form>
        <p style="margin-top:1rem"><a href="index.html">Back to login</a></p>
    </main>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', function (e) {
            e.preventDefault();
            var email = document.getElementById('forgot-email').value.trim();
            fetch(window.API_URL + '/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            }).then(function (r) { return r.json(); }).then(function (d) {
                document.getElementById('forgot-msg').textContent = d.message || 'Check your email for a reset link.';
            });
        });
    </script>
</body>
</html>
