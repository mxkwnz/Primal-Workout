<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout log — Primal-Fit</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .log-detail { max-width: 560px; margin: 0 auto; }
        .log-detail h2 { color: var(--text-color); margin-bottom: 0.5rem; }
        .log-detail .meta { color: var(--muted-text); margin-bottom: 1rem; }
        .log-ex { background: var(--surface); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
        .log-ex h4 { margin: 0 0 0.5rem; color: var(--accent-color); }
        .log-ex .set { font-size: 0.9rem; color: var(--muted-text); }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="history.html" style="color:inherit;text-decoration:none">Primal-Fit</a></div>
        <button class="nav-burger" id="nav-burger" aria-label="Menu"><span></span><span></span><span></span></button>
        <ul class="nav-links" id="nav-links">
            <li><a href="history.html">← History</a></li>
            <li><button id="theme-toggle" class="theme-toggle-btn" type="button">Switch Theme</button></li>
        </ul>
    </nav>
    <main class="container log-detail">
        <p id="log-loading" class="muted-text">Loading…</p>
        <div id="log-content" class="hidden">
            <h2>Workout log</h2>
            <p class="meta" id="log-meta"></p>
            <div id="log-exercises"></div>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script>
        if (!window.requireAuth()) {}
        var id = new URLSearchParams(window.location.search).get('id');
        if (!id) document.getElementById('log-loading').textContent = 'No log selected.';
        else {
            fetch(window.API_URL + '/workoutlogs/' + id, { headers: window.getAuthHeaders() })
                .then(function (r) { return r.json(); })
                .then(function (log) {
                    document.getElementById('log-loading').classList.add('hidden');
                    document.getElementById('log-content').classList.remove('hidden');
                    var d = new Date(log.createdAt);
                    document.getElementById('log-meta').textContent = d.toLocaleString() + (log.durationMinutes ? ' · ' + log.durationMinutes + ' min' : '') + (log.rpe ? ' · RPE ' + log.rpe : '');
                    var container = document.getElementById('log-exercises');
                    (log.exerciseLogs || []).forEach(function (ex) {
                        var div = document.createElement('div');
                        div.className = 'log-ex';
                        var setsStr = (ex.sets || []).map(function (s) { return (s.weight ? s.weight + ' kg × ' : '') + s.reps + ' reps'; }).join(', ');
                        div.innerHTML = '<h4>' + (ex.exerciseName || '') + '</h4><p class="set">' + setsStr + '</p>';
                        container.appendChild(div);
                    });
                })
                .catch(function () { document.getElementById('log-loading').textContent = 'Error loading log.'; });
        }
    </script>
</body>
</html>
